[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "winusb-forge"
version = "0.1.0rc1"
description = "A Windows USB installer creator for Linux with explicit disk safeguards"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "WinUSB Forge contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Installation/Setup",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
]

[project.scripts]
winusb-forge = "winusb_forge.cli:main"

[project.urls]
Repository = "https://github.com/fkxtr/WinUSB-Forge"
Issues = "https://github.com/fkxtr/WinUSB-Forge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
